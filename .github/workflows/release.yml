name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/publish-release.sh"
      - "tests/test_release.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Record validated source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match Cargo.toml ({expected!r})")
          PY
      - run: cargo test --locked --all-targets
      - run: python3 -B -m unittest discover -s tests -p 'test_release.py'

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: acp-traces-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: acp-traces-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: acp-traces-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: acp-traces-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: acp-traces-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: acp-traces-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target "$BUILD_TARGET"
        shell: bash
      - name: Copy binary
        shell: bash
        run: |
          src="target/${BUILD_TARGET}/release/acp-traces"
          if [[ "$BUILD_TARGET" == *"windows"* ]]; then src="${src}.exe"; fi
          cp "$src" "$ARTIFACT_NAME"
      - name: Smoke-test native binary
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$BUILD_TARGET" != "$host" ]]; then
            echo "Cross-compiled ${BUILD_TARGET}; execution requires a matching host."
            exit 0
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          actual="$(./"$ARTIFACT_NAME" --version)"
          [[ "$actual" == "acp-traces $version" ]]
          ./"$ARTIFACT_NAME" --help
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  verify-artifacts:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets
      - name: Verify downloaded binary set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              "acp-traces-linux-amd64",
              "acp-traces-linux-arm64",
              "acp-traces-macos-arm64",
              "acp-traces-macos-amd64",
              "acp-traces-windows-amd64.exe",
              "acp-traces-windows-arm64.exe",
          }
          files = list(Path("release-assets").iterdir())
          actual = {path.name for path in files}
          if actual != expected:
              raise SystemExit(f"Unexpected artifact set: {actual ^ expected}")
          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty binary: {path}")
          PY
      - name: Smoke-test downloaded native binary
        run: |
          chmod +x release-assets/acp-traces-linux-amd64
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          actual="$(release-assets/acp-traces-linux-amd64 --version)"
          [[ "$actual" == "acp-traces $version" ]]
          release-assets/acp-traces-linux-amd64 --help

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets
      - name: Generate binary checksums
        working-directory: release-assets
        run: sha256sum acp-traces-* > SHA256SUMS
      - name: Upload draft, then publish its exact ID
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash scripts/publish-release.sh release-assets

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Compute SHAs and update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_MACOS_ARM64=$(sha256sum acp-traces-macos-arm64 | cut -d' ' -f1)
          SHA_MACOS_AMD64=$(sha256sum acp-traces-macos-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum acp-traces-linux-arm64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum acp-traces-linux-amd64 | cut -d' ' -f1)

          cat > formula.rb <<EOF
          class AcpTraces < Formula
            desc "Experimental OpenTelemetry tracing proxy for Agent Client Protocol"
            homepage "https://github.com/AndreKurait/acp-traces"
            license "Apache-2.0"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/AndreKurait/acp-traces/releases/download/v${VERSION}/acp-traces-macos-arm64"
                sha256 "${SHA_MACOS_ARM64}"
              else
                url "https://github.com/AndreKurait/acp-traces/releases/download/v${VERSION}/acp-traces-macos-amd64"
                sha256 "${SHA_MACOS_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/AndreKurait/acp-traces/releases/download/v${VERSION}/acp-traces-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/AndreKurait/acp-traces/releases/download/v${VERSION}/acp-traces-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir.glob("acp-traces-*").first || "acp-traces"
              mv binary, "acp-traces"
              bin.install "acp-traces"
            end

            test do
              assert_match "acp-traces #{version}", shell_output("#{bin}/acp-traces --version")
              assert_match "OTel tracing proxy", shell_output("#{bin}/acp-traces --help")
            end
          end
          EOF

          gh auth setup-git
          gh repo clone AndreKurait/homebrew-tap tap
          cp formula.rb tap/Formula/acp-traces.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/acp-traces.rb
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update acp-traces to ${VERSION}"
            git push
          fi
